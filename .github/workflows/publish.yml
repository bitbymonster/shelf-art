name: Publish
# On a merge: the whole pack is rebuilt from pictures/ and published; Shelf fetches art.idx and art.pak from it.
on:
  push:
    branches: [main]
    paths: ['pictures/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 tools/check.py pictures --out check
      - run: python3 tools/mkpack.py site --from pictures --sheet site/sheet.png
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
